[tox]
minversion = 4.0.0
skip_install = true
env_list =
    py{311,312,313,314}
    ansible-core{215,216,217,218,219,220,221}
    lint

# The latest versions of the test requirements.
[molecule]
deps =
    pytest
    ansible
    molecule
    robotframework

# Environment variables needed by rootless podman to run the molecule tests.
passenv =
    HOME
    USER
    XDG_RUNTIME_DIR
    DBUS_SESSION_BUS_ADDRESS
    CONTAINER_HOST
    AFS_*

[testenv]
description = Run the plugin unit tests with the latest ansible-core for this python
deps =
    ansible-core
    pytest
commands =
    pytest tests/unit {posargs}

# Unit tests and playbook syntax checks with each supported ansible-core
# version, from the minimum version given in meta/runtime.yml.
[testenv:ansible-core{215,216,217,218,219,220,221}]
description = Run unit tests and playbook syntax checks with a specific ansible-core version
base_python =
    core215: python3.11
    core{216,217}: python3.12
    core{218,219}: python3.13
    core{220,221}: python3.14
deps =
    pytest
    core215: ansible-core>=2.15,<2.16
    core216: ansible-core>=2.16,<2.17
    core217: ansible-core>=2.17,<2.18
    core218: ansible-core>=2.18,<2.19
    core219: ansible-core>=2.19,<2.20
    core220: ansible-core>=2.20,<2.21
    core221: ansible-core>=2.21,<2.22
set_env =
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/../../..{:}{envtmpdir}/collections
commands_pre =
    ansible-galaxy collection install -r tests/requirements.yml -p {envtmpdir}/collections
commands =
    pytest tests/unit {posargs}
    ansible-playbook --syntax-check -i localhost, \
        playbooks/deploy_cell.yaml \
        playbooks/deploy_realm.yaml \
        playbooks/deploy_robotserver.yaml \
        playbooks/local_devel.yaml \
        playbooks/local_install.yaml

# Run all of the tests, including the role and playbook tests in podman
# containers, with the latest versions of python and ansible. Use the pytest
# -k option to select the tests to run, for example:
#
#   tox -e latest -- -k roles
#   tox -e latest -- -k "openafs_server and alma9"
#
[testenv:latest]
description = Run all of the tests with the latest versions of python and ansible
base_python = python3.14
deps =
    {[molecule]deps}
passenv =
    {[molecule]passenv}
set_env =
    AFS_TEST_LOGDIR = {env_dir}/test-logs
commands =
    pytest -s -v --junitxml={env_dir}/test-logs/junit.xml tests {posargs}

[testenv:lint]
description = Run lint checks
basepython = python3
deps =
    ansible==14.5.0
    ansible-lint==26.10.0
commands =
    ansible-lint roles playbooks extensions

[testenv:docs]
description = Build the documentation
basepython = python3
deps =
  Sphinx==7.2.6
  sphinx-rtd-theme==2.0.0
changedir = docs
commands =
  sphinx-build -M html source build

[testenv:build]
description = Build the distribution tarball
basepython = python3
allowlist_externals =
    mkdir
deps =
    ansible-core
commands =
    mkdir -p builds
    ansible-galaxy collection build --output-path builds .

[testenv:install]
description = Build and install the distribution tarball
basepython = python3
allowlist_externals =
    mkdir
    bash
deps =
    ansible-core
commands =
    mkdir builds
    ansible-galaxy collection build --output-path builds .
    bash -c "ansible-galaxy collection install --force --pre builds/openafs_contrib-openafs-*.tar.gz"

[testenv:dev]
description = Create development environment
basepython = python3
deps =
    {[molecule]deps}
passenv =
    {[molecule]passenv}
    ANSIBLE_COLLECTIONS_PATH
commands =

[pytest]
testpaths = tests
