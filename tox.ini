[tox]
minversion = 4.0.0
skip_install = true
env_list =
    py{311,312,313,314}
    ansible-core{215,216,217,218,219,220,221}
    lint

[molecule]
deps =
    pytest
    ansible==14.5.0
    molecule==26.10.0
    molecule-proxmox==1.3.0
    robotframework==7.5

[testenv]
description = Run the plugin unit tests with the latest ansible-core for this python
deps =
    ansible-core
    pytest
commands =
    pytest tests/unit {posargs}

# Unit tests and playbook syntax checks with a specific ansible-core version.
# Versions older than 2.15 are available, but not run by default.
[testenv:ansible-core{210,211,212,213,214,215,216,217,218,219,220,221}]
description = Run unit tests and playbook syntax checks with a specific ansible-core version
base_python =
    core{210,211}: python3.9
    core{212,213,214}: python3.10
    core215: python3.11
    core{216,217}: python3.12
    core{218,219}: python3.13
    core{220,221}: python3.14
deps =
    pytest
    core210: ansible-base>=2.10,<2.11
    core{210,211}: jinja2<3.1
    core211: ansible-core>=2.11,<2.12
    core212: ansible-core>=2.12,<2.13
    core213: ansible-core>=2.13,<2.14
    core214: ansible-core>=2.14,<2.15
    core215: ansible-core>=2.15,<2.16
    core216: ansible-core>=2.16,<2.17
    core217: ansible-core>=2.17,<2.18
    core218: ansible-core>=2.18,<2.19
    core219: ansible-core>=2.19,<2.20
    core220: ansible-core>=2.20,<2.21
    core221: ansible-core>=2.21,<2.22
set_env =
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/../../..{:}{envtmpdir}/collections
commands_pre =
    ansible-galaxy collection install -r tests/requirements.yml -p {envtmpdir}/collections
commands =
    pytest tests/unit {posargs}
    ansible-playbook --syntax-check -i localhost, \
        playbooks/deploy_cell.yaml \
        playbooks/deploy_realm.yaml \
        playbooks/deploy_robotserver.yaml \
        playbooks/local_devel.yaml \
        playbooks/local_install.yaml

[testenv:roles]
description = Run the roles tests
basepython = python3
deps =
    {[molecule]deps}
passenv =
    SSH_*
    PROXMOX_*
commands =
    pytest -s -v tests/integration/roles {posargs}

[testenv:playbooks]
description = Run the playbook tests
basepython = python3
deps =
    {[molecule]deps}
passenv =
    SSH_*
    PROXMOX_*
commands =
    pytest -s -v tests/integration/playbooks {posargs}

[testenv:lint]
description = Run lint checks
basepython = python3
deps =
    ansible==14.5.0
    ansible-lint==26.10.0
commands =
    ansible-lint roles playbooks extensions

[testenv:docs]
description = Build the documentation
basepython = python3
deps =
  Sphinx==7.2.6
  sphinx-rtd-theme==2.0.0
changedir = docs
commands =
  sphinx-build -M html source build

[testenv:build]
description = Build the distribution tarball
basepython = python3
allowlist_externals =
    mkdir
deps =
    ansible-core
commands =
    mkdir -p builds
    ansible-galaxy collection build --output-path builds .

[testenv:install]
description = Build and install the distribution tarball
basepython = python3
allowlist_externals =
    mkdir
    bash
deps =
    ansible-core
commands =
    mkdir builds
    ansible-galaxy collection build --output-path builds .
    bash -c "ansible-galaxy collection install --force --pre builds/openafs_contrib-openafs-*.tar.gz"

[testenv:dev]
description = Create development environment
basepython = python3
deps =
    {[molecule]deps}
passenv =
    SSH_*
    PROXMOX_*
    ANSIBLE_COLLECTIONS_PATH
commands =
