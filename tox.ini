# The pytest configuration. (This section is read by pytest, not tox.)
[pytest]
testpaths = tests

[tox]
minversion = 4.36.0
skip_install = true
env_list =
    lint
    py{311,312,313,314}
    ansible-core{216,217,218,219,220,221}

[testenv]
description =
    py311: Unit tests, python 3.11
    py312: Unit tests, python 3.12
    py313: Unit tests, python 3.13
    py314: Unit tests, python 3.14
depends =
    py{311,312,313,314}: lint
deps =
    ansible-core
    pytest
commands =
    pytest tests/unit {posargs}

# Playbook syntax checks and unit tests with each supported ansible-core
# version, from the minimum version given in meta/runtime.yml.
[testenv:ansible-core{216,217,218,219,220,221}]
description =
    core216: Syntax checks and unit tests, ansible-core 2.16
    core217: Syntax checks and unit tests, ansible-core 2.17
    core218: Syntax checks and unit tests, ansible-core 2.18
    core219: Syntax checks and unit tests, ansible-core 2.19
    core220: Syntax checks and unit tests, ansible-core 2.20
    core221: Syntax checks and unit tests, ansible-core 2.21
base_python =
    core{216,217}: python3.12
    core{218,219}: python3.13
    core{220,221}: python3.14
depends = lint
deps =
    pytest
    core216: ansible-core>=2.16,<2.17
    core217: ansible-core>=2.17,<2.18
    core218: ansible-core>=2.18,<2.19
    core219: ansible-core>=2.19,<2.20
    core220: ansible-core>=2.20,<2.21
    core221: ansible-core>=2.21,<2.22
# Install the required collections into a persistent collections path, and
# symlink this collection into a separate collections path, so the source tree
# may be located in any directory. The paths are kept separate to ensure
# ansible-galaxy never installs into a path which contains the source tree.
set_env =
    ANSIBLE_COLLECTIONS_PATH = {env_dir}/collections:{envtmpdir}/source
allowlist_externals =
    mkdir
    ln
commands_pre =
    ansible-galaxy collection install -r tests/requirements.yml -p {env_dir}/collections
    mkdir -p {envtmpdir}/source/ansible_collections/openafs_contrib
    ln -sfn {toxinidir} {envtmpdir}/source/ansible_collections/openafs_contrib/openafs
commands =
    ansible-playbook --syntax-check -i tests/syntax-check-inventory.yaml \
        playbooks/deploy_cell.yaml \
        playbooks/deploy_realm.yaml \
        playbooks/deploy_robotserver.yaml \
        playbooks/local_devel.yaml \
        playbooks/local_install.yaml
    pytest tests/unit {posargs}

# Run all of the tests, including the role and playbook tests in podman
# containers, with the latest versions of python and ansible. Use the pytest
# -k option to select the tests to run, for example:
#
#   tox -e latest -- -k roles
#   tox -e latest -- -s -k "openafs_server and alma9"
#
[testenv:latest]
description = All tests, latest python and ansible; use -k to select tests
base_python = python3.14
deps =
    pytest
    ansible
    molecule
    robotframework
# Environment variables needed by rootless podman to run the molecule tests.
passenv =
    HOME
    USER
    XDG_RUNTIME_DIR
    DBUS_SESSION_BUS_ADDRESS
    CONTAINER_HOST
    AFS_*
set_env =
    AFS_TEST_LOGDIR = {env_dir}/test-logs
    AFS_TEST_ANSIBLE_HOME = {env_dir}/ansible-home
commands =
    pytest -v --junitxml={env_dir}/test-logs/junit.xml tests {posargs}

# Run all of the tests with the oldest supported version of ansible-core (as
# given in meta/runtime.yml), and the newest python supported by that version.
# Use the pytest -k option to select the tests to run, as for latest.
[testenv:oldest]
description = All tests, oldest supported ansible; use -k to select tests
base_python = python3.12
deps =
    pytest
    ansible>=9,<10
    molecule
    robotframework
passenv =
    {[testenv:latest]passenv}
set_env =
    AFS_TEST_LOGDIR = {env_dir}/test-logs
    AFS_TEST_ANSIBLE_HOME = {env_dir}/ansible-home
commands =
    pytest -v --junitxml={env_dir}/test-logs/junit.xml tests {posargs}

# Run the lint checks first, and stop if they fail.
[testenv:lint]
description = Lint checks
basepython = python3
fail_fast = true
deps =
    ansible==14.5.0
    ansible-lint==26.10.0
set_env =
    ANSIBLE_HOME = {env_dir}/ansible-home
commands =
    ansible-lint roles playbooks extensions

[testenv:docs]
description = Build the documentation
basepython = python3
deps =
  -r docs/requirements.txt
changedir = docs
commands =
  sphinx-build -M html source build

[testenv:build]
description = Build the collection tarball
basepython = python3
allowlist_externals =
    mkdir
deps =
    ansible-core
commands =
    mkdir -p builds
    ansible-galaxy collection build --output-path builds .

[testenv:install]
description = Build and install the collection
basepython = python3
allowlist_externals =
    mkdir
    bash
deps =
    ansible-core
commands =
    mkdir builds
    ansible-galaxy collection build --output-path builds .
    bash -c "ansible-galaxy collection install --force --pre builds/openafs_contrib-openafs-*.tar.gz"

[testenv:dev]
description = Development virtualenv with the test requirements
basepython = python3
deps =
    {[testenv:latest]deps}
passenv =
    {[testenv:latest]passenv}
    ANSIBLE_COLLECTIONS_PATH
commands =
