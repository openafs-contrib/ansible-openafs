---
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "podman exec -it {instance} /bin/bash"
platforms:
  - name: m-role-server${AFS_TESTID}
    groups:
      - afs_databases
      - afs_fileservers
provisioner:
  name: ansible
  playbooks:
    create: ../../../../extensions/molecule/resources/podman/create.yml
    destroy: ../../../../extensions/molecule/resources/podman/destroy.yml
  inventory:
    group_vars:
      all:
        afs_cell: "example.com"
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
        afs_install_method: "bdist"
        # afs_security_model: "${AFS_SECURITY_MODEL:-none}"
        afs_csdb_file: "${MOLECULE_EPHEMERAL_DIRECTORY}/csdb.yaml"
        afs_pseudo_partitions: ['a', 'b']
        afs_service_keytab: "../__files__/example-aes.keytab"
        afs_install_archive: "${AFS_INSTALL_ARCHIVE}"
        afs_install_archive_remote_src: false
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
