---
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "podman exec -it {instance} /bin/bash"
platforms:
  - name: m-role-krbclient${AFS_TESTID}
provisioner:
  name: ansible
  playbooks:
    create: ../../../../extensions/molecule/resources/podman/create.yml
    destroy: ../../../../extensions/molecule/resources/podman/destroy.yml
  env:
    ANSIBLE_PIPELINING: "True"
    ANSIBLE_STDOUT_CALLBACK: "yaml"
  inventory:
    group_vars:
      all:
        afs_cell: "example.com"
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
