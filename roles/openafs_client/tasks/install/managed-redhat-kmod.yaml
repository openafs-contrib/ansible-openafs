---
#
# Install a prebuilt OpenAFS kernel module for the currently running kernel
# version. This install method requires a private yum repo populated with
# OpenAFS packages and prebuilt kernel module rpm package files (kmod-openafs).
#
# Just installing the 'kmod-openafs' package will install a kernel module for
# the most recent kernel version in the yum repository, not neccessarily the
# version currently running on the remote node, and the newest OpenAFS version
# in the repository may not have a kernel module for the running kernel (for
# example, kmod-openafs packages are not built for pre-releases). In
# order to obviate the need to update the kernel and endure a reboot when
# importing this role, we find the newest kmod-openafs package which provides
# the kernel modules for the running kernel, and then install the OpenAFS
# packages for the same OpenAFS version.
#

- name: Add OpenAFS yum repo
  become: yes
  yum_repository:
    name: openafs
    description: OpenAFS yum repo
    baseurl: "{{ repo }}"
    gpgcheck: no
  loop:
    - "{{ afs_yum_repo }}"
  loop_control:
    loop_var: repo

- name: Find kmod-openafs for the running kernel
  become: yes
  command:
    cmd: >
      dnf repoquery --quiet --latest-limit 1
      --queryformat '%{name} %{version} %{release}\n'
      --whatprovides 'kernel-modules = {{ ansible_facts.kernel }}'
  changed_when: False
  register: kmod_query
  check_mode: no

- set_fact:
    kmod_openafs: "{{ kmod_query.stdout_lines | select('match', 'kmod-openafs ') | first | d('') | split }}"

- name: Verify kmod-openafs was found
  fail:
    msg: "kmod-openafs not found for kernel version {{ ansible_facts.kernel }}."
  when: kmod_openafs | count != 3

- name: Install OpenAFS client with kmod
  become: yes
  yum:
    state: present
    name:
      - "openafs-{{ kmod_openafs[1] }}"
      - "openafs-client-{{ kmod_openafs[1] }}"
      - "openafs-krb5-{{ kmod_openafs[1] }}"
      - "kmod-openafs-{{ kmod_openafs[1] }}-{{ kmod_openafs[2] }}"
  register: yum_results

- name: Get installation paths
  openafs_contrib.openafs.openafs_get_install_paths:
  register: install_results

- name: Store installation facts
  become: yes
  openafs_contrib.openafs.openafs_store_facts:
    state: update
    facts:
      install_method: "{{ afs_install_method }}"
      client_installed: yes
      client_service_name: openafs-client
      bins: "{{ install_results.bins }}"
      dirs: "{{ install_results.dirs }}"
      cacheinfo: "{{ install_results.cacheinfo }}"
  when: not ansible_check_mode

- name: Set client startup options
  become: yes
  lineinfile:
    path: /etc/sysconfig/openafs
    regexp: "^AFSD_ARGS="
    line: 'AFSD_ARGS="{{ afs_afsd_opts }}"'
    state: present
  when: afs_afsd_opts is defined
  notify:
    - "client configuration changed"
