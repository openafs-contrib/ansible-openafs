---
- name: Unsupported OS
  fail:
    msg:
      - "Task files not found for this operating system:"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}-{{ ansible_facts.distribution_version }}"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}-{{ ansible_facts.distribution_major_version }}"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}"
      - "{{ ansible_facts.os_family | replace(' ', '_') }}"
      - "{{ ansible_facts.system | replace(' ', '_') }}"
