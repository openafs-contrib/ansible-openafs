---
- name: Verify
  hosts: all
  tasks:
    # Run libdoc on the instance, since the instance name may not be
    # resolvable on the controller.
    - name: Query robot server.
      ansible.builtin.command:
        cmd: "{{ afs_robotserver_virtualenv | d('/opt/robotserver') }}/bin/libdoc Remote::localhost:8270 list"
      changed_when: false
      register: libdoc_list

    #- debug:
    #    var: libdoc_list

    - name: Assert keywords found.
      ansible.builtin.assert:
        that: '"Create Volume" in libdoc_list.stdout_lines'
        success_msg: Create Volume keyword found.
        fail_msg: Create Volume keyword not found.
