---
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "podman exec -it {instance} /bin/bash"
platforms:
  - name: m-role-robotserver
provisioner:
  name: ansible
  playbooks:
    create: ../../../../extensions/molecule/resources/podman/create.yml
    destroy: ../../../../extensions/molecule/resources/podman/destroy.yml
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
