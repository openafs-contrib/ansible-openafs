---
- name: "RockyLinux-8: Add EPEL repository"
  become: yes
  yum:
    state: present
    name: epel-release
    update_cache: yes
  tags: root

- name: "RockyLinux-8: Install development packages"
  become: yes
  yum:
    state: present
    name:
      - autoconf
      - automake
      - bison
      - docbook-dtds
      - docbook-style-xsl
      - doxygen
      - elfutils-devel
      - flex
      - fuse-devel
      - gcc
      - git
      - glibc-devel
      - jansson-devel
      - krb5-devel
      - libevent-devel
      - libtool
      - libxslt
      - make
      - ncurses-devel
      - openssl-devel
      - pam-devel
      - perl-core
      - perl-devel
      - perl-ExtUtils-Embed
      - perl-FindBin
      - perl-Sys-Hostname
      - perl-Test-Simple
      - redhat-rpm-config
      - rpm-build
      - swig
      - wget
      - which
  tags: root
