---
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "podman exec -it {instance} /bin/bash"
platforms:
  - name: m-role-devel${AFS_TESTID}
provisioner:
  name: ansible
  playbooks:
    create: ../../../../extensions/molecule/resources/podman/create.yml
    destroy: ../../../../extensions/molecule/resources/podman/destroy.yml
  inventory:
    group_vars:
      all:
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
        afs_git_repo: "${AFS_GIT_REPO:-git://git.openafs.org/openafs.git}"
        afs_git_version: "${AFS_GIT_VERSION:-master}"
        afs_builds: "${AFS_BUILDS:-~/.cache/ansible-openafs/builds}"
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
