---
- name: "Unsupported platform."
  fail:
    msg:
      - "File not found:"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}-{{ ansible_facts.distribution_version }}.yaml"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}-{{ ansible_facts.distribution_major_version }}.yaml"
      - "{{ ansible_facts.distribution | replace(' ', '_') }}.yaml"
      - "{{ ansible_facts.os_family }}.yaml"
      - "{{ ansible_facts.system | replace(' ', '_') }}.yaml"
      - "Search path:"
      - "{{ role_path }}/tasks/install-packages"
