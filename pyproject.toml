[tool.tox]
requires = ["tox>=4.36.0", "tox-ansible"]

[tool.tox-ansible]
coverage = true
skip = [
    "devel",
    "milestone",
]

[tool.tox.env.format]
description = "Format the python code with black"
skip_install = true
deps = ["black"]
commands = [["black", "plugins", "tests"]]

[tool.black]
line-length = 100
