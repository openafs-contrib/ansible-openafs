---
driver:
  name: podman
platforms:
  - name: krbclient-fake-alma9
    image: localhost/ansible-openafs-alma9
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
    groups:
      - afs_clients
provisioner:
  name: ansible
  env:
    # Use the fake package manager modules.
    ANSIBLE_LIBRARY: "${MOLECULE_SCENARIO_DIRECTORY}/../utils/fakes/library"
  playbooks:
    prepare: ../utils/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_pipelining: true
        afs_realm: EXAMPLE.COM
        afs_kdc_servers: kdc.example.com
        afs_kadmin_server: kdc.example.com
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
