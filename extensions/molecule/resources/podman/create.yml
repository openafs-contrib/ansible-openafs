---
#
# Create podman containers for the molecule instances.
#
# The operating system is selected with the AFS_TEST_OS environment variable.
# The containers are created from the test image for the operating system,
# which must be built first with tests/build-images.sh.
#
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    afs_test_os: "{{ lookup('ansible.builtin.env', 'AFS_TEST_OS') | default('alma9', true) }}"
    afs_test_image: "localhost/ansible-openafs-{{ afs_test_os }}"
  tasks:
    - name: Lookup the test image
      containers.podman.podman_image_info:
        name: "{{ afs_test_image }}"
      register: afs_test_image_info

    - name: Verify the test image is available
      ansible.builtin.assert:
        that:
          - afs_test_image_info.images | length > 0
        fail_msg: >-
          The test image {{ afs_test_image }} was not found. Build it with:
          tests/build-images.sh {{ afs_test_os }}

    # The containers are connected to a podman network, so the containers can
    # find each other by name.
    - name: Create container network
      containers.podman.podman_network:
        name: molecule
        state: present

    - name: Create containers
      containers.podman.podman_container:
        name: "{{ item.name }}"
        hostname: "{{ item.name }}"
        image: "{{ afs_test_image }}"
        network: molecule
        # Use the /etc/hosts file from the image, instead of a bind mounted
        # file, so the playbooks can update /etc/hosts as on a regular system.
        no_hosts: true
        systemd: always
        state: started
      loop: "{{ molecule_yml.platforms }}"

    # The system state may be 'degraded' in a container, so ignore the exit code.
    - name: Wait for systemd to finish starting
      ansible.builtin.command:
        cmd: "podman exec {{ item.name }} systemctl is-system-running --wait"
      changed_when: false
      failed_when: false
      loop: "{{ molecule_yml.platforms }}"

    - name: Write instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          {% for item in molecule_yml.platforms %}
          - instance: {{ item.name }}
            address: {{ item.name }}
            user: root
            connection: containers.podman.podman
          {% endfor %}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
