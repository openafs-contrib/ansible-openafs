---
#
# Remove the podman containers for the molecule instances. The images and
# the container network are kept for later runs.
#
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove containers
      containers.podman.podman_container:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ molecule_yml.platforms }}"

    - name: Remove instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          []
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
