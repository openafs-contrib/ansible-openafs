  opensuse15: registry.opensuse.org/opensuse/leap:15.6
  opensuse16: registry.opensuse.org/opensuse/leap:16.0
  oracle8: docker.io/library/oraclelinux:8
  oracle9: docker.io/library/oraclelinux:9
