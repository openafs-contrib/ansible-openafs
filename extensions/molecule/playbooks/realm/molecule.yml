---
dependency:
  name: galaxy

platforms:
  - name: openafs-default
    groups:
      - afs_admin_client
      - afs_clients
      - afs_databases
      - afs_fileservers
      - afs_kdcs

provisioner:
  name: ansible
  playbooks:
    converge: ../../resources/playbooks/converge_realm.yml
    verify: ../../resources/playbooks/verify_realm.yml
  inventory:
    group_vars:
      all:
        afs_install_method: "managed"
        afs_realm: "EXAMPLE.COM"
        afs_cell: "example.com"
        afs_admin: "admin"
        afs_user: "alice"
        afs_user_id: 2000
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"

verifier:
  name: ansible

scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
