---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: openafs-default
    image: localhost/ansible-openafs-${AFS_TEST_OS:-alma9}
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
    groups:
      - afs_admin_client
      - afs_clients
      - afs_databases
      - afs_fileservers
      - afs_kdcs

provisioner:
  name: ansible
  playbooks:
    prepare: ../../resources/playbooks/prepare.yml
    converge: ../../resources/playbooks/converge_cell.yml
    verify: ../../resources/playbooks/verify_cell.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_pipelining: true
        afs_install_method: "managed"
        afs_module_install_method: "kmod"
        afs_realm: "EXAMPLE.COM"
        afs_cell: "example.com"
        afs_admin: "admin"
        afs_user: "alice"
        afs_user_id: 2000
        afs_pseudo_partitions: ['a', 'b']
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"

verifier:
  name: ansible

scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
