---
- name: Find the kernel version
  ansible.builtin.import_playbook: ../utils/playbooks/kernel_version.yml

- name: Verify
  hosts: all
  tasks:
    - name: Verify the build tools are installed
      ansible.builtin.shell:
        cmd: "command -v {{ item }}"
      changed_when: false
      loop:
        - autoconf
        - automake
        - bison
        - flex
        - gcc
        - git
        - libtoolize
        - make
        - perl
        - swig
        - which

    - name: Check the Kerberos headers are installed
      ansible.builtin.stat:
        path: /usr/include/krb5.h
      register: krb5_h

    - name: Verify the Kerberos headers are installed
      ansible.builtin.assert:
        that:
          - krb5_h.stat.exists

    - name: Check the kernel headers are installed
      ansible.builtin.stat:
        path: "{{ test_kernel_headers_dir }}/Makefile"
      register: makefile

    - name: Verify the kernel headers are installed
      ansible.builtin.assert:
        that:
          - makefile.stat.exists
