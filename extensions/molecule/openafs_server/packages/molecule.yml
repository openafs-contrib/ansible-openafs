---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: m-role-server${AFS_TESTID}
    image: localhost/ansible-openafs-${AFS_TEST_OS:-alma9}
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
    groups:
      - afs_databases
      - afs_fileservers
provisioner:
  name: ansible
  playbooks:
    prepare: ../../resources/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_pipelining: true
        afs_cell: "example.com"
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
        afs_install_method: "packages"
        afs_security_model: "${AFS_SECURITY_MODEL:-none}"
        afs_csdb_file: "${MOLECULE_EPHEMERAL_DIRECTORY}/csdb.yaml"
        afs_pseudo_partitions: ['a', 'b']
        afs_service_keytab: "../__files__/example-aes.keytab"
        afs_install_archive: "${AFS_INSTALL_ARCHIVE}"
        afs_install_archive_remote_src: false
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
