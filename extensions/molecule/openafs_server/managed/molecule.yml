---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: m-role-server${AFS_TESTID}
    image: localhost/ansible-openafs-${AFS_TEST_OS:-alma9}
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
    groups:
      - afs_databases
      - afs_fileservers
provisioner:
  name: ansible
  playbooks:
    prepare: ../../resources/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        afs_cell: "example.com"
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
        afs_install_method: "managed"
        # afs_yum_repo: "${AFS_YUM_REPO}"
        # afs_security_model: "${AFS_SECURITY_MODEL:-none}"
        afs_csdb_file: "${MOLECULE_EPHEMERAL_DIRECTORY}/csdb.yaml"
        afs_pseudo_partitions: ['a', 'b']
        afs_service_keytab: "../__files__/example-aes.keytab"
        afs_server_netinfo: 0.0.0.0
        afs_server_netrestrict:
          - 1.1.1.1
          - 2.2.2.2
        # afs_bosserver_opts: -pidfiles -transarc-logs
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
