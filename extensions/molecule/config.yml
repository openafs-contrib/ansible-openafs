---
#
# Molecule base configuration for all of the scenarios in this collection.
# Molecule loads this file when it is run from the collection root directory.
#
# The scenarios are located in extensions/molecule/<role>/<scenario> for the
# roles, and in extensions/molecule/playbooks/<scenario> for the playbooks,
# so the relative paths below are the same for all of the scenarios.
#
# The test instances are podman containers, created by the shared create and
# destroy playbooks. Set AFS_TEST_OS to select the operating system.
#
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "podman exec -it {instance} /bin/bash"
provisioner:
  name: ansible
  playbooks:
    create: ../../resources/podman/create.yml
    destroy: ../../resources/podman/destroy.yml
