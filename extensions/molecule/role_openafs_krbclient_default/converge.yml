---
- name: Converge the Kerberos servers
  hosts: afs_kdcs
  tasks:
    - name: Install and configure the Kerberos server
      ansible.builtin.import_role:
        name: openafs_contrib.openafs.openafs_krbserver
      when: afs_test_mode == 'real'

- name: Converge the Kerberos clients
  hosts: afs_clients
  tasks:
    - name: Install and configure the Kerberos client
      ansible.builtin.import_role:
        name: openafs_contrib.openafs.openafs_krbclient
