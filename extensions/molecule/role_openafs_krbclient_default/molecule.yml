---
driver:
  name: podman
platforms:
  - name: krbclient-alma10-kdc
    image: localhost/ansible-openafs-alma10
    pre_build_image: true
    override_command: false
    systemd: always
    network: "molecule-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - --no-hosts
    groups:
      - afs_kdcs
  - name: krbclient-alma10
    image: localhost/ansible-openafs-alma10
    pre_build_image: true
    override_command: false
    systemd: always
    network: "molecule-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - --no-hosts
    groups:
      - afs_clients
  - name: krbclient-debian13-kdc
    image: localhost/ansible-openafs-debian13
    pre_build_image: true
    override_command: false
    systemd: always
    network: "molecule-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - --no-hosts
    groups:
      - afs_kdcs
  - name: krbclient-debian13
    image: localhost/ansible-openafs-debian13
    pre_build_image: true
    override_command: false
    systemd: always
    network: "molecule-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - --no-hosts
    groups:
      - afs_clients
provisioner:
  name: ansible
  config_options:
    defaults:
      forks: 40
  playbooks:
    prepare: ../utils/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_pipelining: true
        afs_realm: EXAMPLE.COM
        # Each client uses the KDC for the same operating system.
        afs_os_name: "{{ inventory_hostname | regex_replace('-kdc$$', '') }}"
        afs_kdc_servers: "{{ afs_os_name }}-kdc"
        afs_kadmin_server: "{{ afs_os_name }}-kdc"
        afs_realm_files: "${MOLECULE_EPHEMERAL_DIRECTORY}/{{ afs_os_name }}"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
