provisioner:
  name: ansible
  config_options:
    defaults:
      forks: 40
  env:
    # Use the fake modules when AFS_TEST_MODE=fake.
    ANSIBLE_LIBRARY: "${MOLECULE_SCENARIO_DIRECTORY}/../utils/${AFS_TEST_MODE:-real}/library"
    ANSIBLE_ACTION_PLUGINS: "${MOLECULE_SCENARIO_DIRECTORY}/../utils/${AFS_TEST_MODE:-real}/action_plugins"
  playbooks:
    prepare: ../utils/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_pipelining: true
        afs_test_mode: "${AFS_TEST_MODE:-real}"
        afs_realm: EXAMPLE.COM
        # Each client uses the KDC for the same operating system.
        afs_os_name: "{{ inventory_hostname | regex_replace('-kdc$$', '') }}"
        afs_kdc_servers: "{{ afs_os_name }}-kdc"
        afs_kadmin_server: "{{ afs_os_name }}-kdc"
        afs_realm_files: "${MOLECULE_EPHEMERAL_DIRECTORY}/{{ afs_os_name }}"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
