---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: m-role-client${AFS_TESTID}
    image: localhost/ansible-openafs-${AFS_TEST_OS:-alma9}
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
    groups:
      - afs_clients
provisioner:
  name: ansible
  playbooks:
    prepare: ../../resources/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        afs_cell: "example.com"
        afs_cell_files: "${MOLECULE_EPHEMERAL_DIRECTORY}"
        afs_install_method: "managed"
        afs_module_install_method: "kmp"
        afs_csdb_file: ""
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
