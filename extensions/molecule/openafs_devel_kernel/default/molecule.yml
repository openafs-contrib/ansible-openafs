---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: m-role-devel-kernel${AFS_TESTID}
    image: localhost/ansible-openafs-${AFS_TEST_OS:-alma9}
    pre_build_image: true
    override_command: false
    systemd: always
    network: molecule
    extra_opts:
      - --no-hosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../../resources/playbooks/prepare.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        afs_devel_allow_kernel_update: yes
verifier:
  name: ansible
scenario:
  create_sequence:
    - create
    - prepare
  check_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - cleanup
    - destroy
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
